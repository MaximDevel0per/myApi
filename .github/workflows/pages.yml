name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nur ein Deploy gleichzeitig, laufende werden nicht abgebrochen
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Abhaengigkeiten installieren
        run: npm ci

      - name: OpenAPI-Dokument erzeugen
        run: |
          node -v
          npm -v
          node -e "require('better-sqlite3'); console.log('better-sqlite3 laedt')"
          npm run openapi 2>&1

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
