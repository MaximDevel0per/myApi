<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NestNotes API - Dokumentation</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/swagger-ui-dist@5.29.0/swagger-ui.css"
    />
    <style>
      body {
        margin: 0;
      }
      .hinweis {
        padding: 0.75rem 1rem;
        font: 14px/1.5 system-ui, sans-serif;
        background: #fff4e5;
        border-bottom: 1px solid #f0c68a;
      }
    </style>
  </head>
  <body>
    <p class="hinweis">
      Statische Dokumentation. Es läuft kein Server dahinter, "Try it out"
      funktioniert nur gegen eine eigene lokale Instanz.
    </p>
    <div id="swagger-ui"></div>
    <script src="https://unpkg.com/swagger-ui-dist@5.29.0/swagger-ui-bundle.js"></script>
    <script>
      window.ui = SwaggerUIBundle({
        url: './openapi.json',
        dom_id: '#swagger-ui',
        deepLinking: true,
      });
    </script>
  </body>
</html>
